<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ملخص الأخبار الذكي</title>
  <style>
    body { font-family: 'Cairo', Tahoma, Arial, sans-serif; background: #f7fafc; margin: 0; padding: 0; }
    .container { max-width: 900px; margin: 40px auto; background: #fff; border-radius: 20px; box-shadow: 0 2px 24px #0002; padding: 40px 32px; direction: rtl; }
    textarea {
      width: 100%;
      min-height: 180px;
      max-height: 400px;
      border-radius: 18px;
      border: 2px solid #bdbdfc;
      margin-bottom: 18px;
      font-size: 20px;
      resize: vertical;
      line-height: 2.2;
      background: #f8fafd;
      box-shadow: 0 2px 12px #6c63ff11;
      transition: border 0.2s, box-shadow 0.2s, background 0.2s;
    }
    textarea:focus {
      border: 2.5px solid #6c63ff;
      background: #f3f0ff;
      outline: none;
      box-shadow: 0 4px 24px #6c63ff22;
    }
    button { background: linear-gradient(90deg,#6c63ff,#00bfae); color: #fff; border: none; padding: 14px 36px; border-radius: 10px; font-size: 18px; cursor: pointer; margin-left: 10px; margin-bottom: 10px; transition: background 0.2s; }
    button:hover { background: linear-gradient(90deg,#554ee0,#009e8e); }
    .result { background: #f3f0ff; border-radius: 10px; padding: 20px; margin-top: 22px; font-size: 20px; min-height: 32px; word-break: break-word; line-height: 2; }
    h1 { color: #6c63ff; text-align: center; margin-bottom: 22px; font-size: 2.2rem; }
    label { font-weight: bold; display: block; margin-bottom: 10px; font-size: 1.1rem; }
    .row { display: flex; gap: 16px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .row label { margin-bottom: 0; font-weight: normal; }
    input[type=number] { width: 70px; padding: 8px; border-radius: 7px; border: 1px solid #ccc; font-size: 16px; }
    .keywords { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .keyword { background: #e0f7fa; color: #00796b; padding: 8px 18px; border-radius: 18px; font-size: 17px; }
    .entities { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .entity { background: #ffe0b2; color: #e65100; padding: 8px 18px; border-radius: 18px; font-size: 17px; }
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #6c63ff;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
      margin: 18px auto;
      display: none;
    }
    @keyframes spin {
      0% { transform: rotate(0deg);}
      100% { transform: rotate(360deg);}
    }
    @media (max-width: 900px) { .container { max-width: 99vw; padding: 10px 2vw; } }
    @media (max-width: 600px) { .container { padding: 8px 1vw; } .row { flex-direction: column; align-items: flex-start; gap: 4px; } }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>ملخص الأخبار الذكي</h1>
    <label for="news">الصق نص الخبر أو المقال هنا:</label>
    <textarea id="news" placeholder="اكتب أو الصق نص الخبر...">أعلنت وزارة الصحة في المملكة العربية السعودية اليوم عن إطلاق حملة تطعيم وطنية ضد الإنفلونزا الموسمية، وذلك بحضور وزير الصحة الدكتور توفيق الربيعة في مدينة الرياض. وتهدف الحملة إلى حماية المواطنين والمقيمين من مضاعفات الإنفلونزا، خاصة الفئات الأكثر عرضة مثل كبار السن والأطفال ومرضى الأمراض المزمنة. وأكد الدكتور الربيعة أن الوزارة وفرت اللقاحات في جميع المراكز الصحية والمستشفيات الحكومية، داعياً الجميع إلى المبادرة بأخذ اللقاح. كما أشار إلى أن الحملة تأتي ضمن جهود المملكة المستمرة لتعزيز الصحة العامة والوقاية من الأمراض.</textarea>
    <div class="row">
      <label for="summaryLen">عدد جمل الملخص:</label>
      <input type="number" id="summaryLen" min="1" max="10" value="3">
      <button onclick="summarize()">تلخيص النص</button>
    </div>
    <div class="row">
      <label for="keywordsNum">عدد الكلمات المفتاحية:</label>
      <input type="number" id="keywordsNum" min="1" max="20" value="10">
      <button onclick="extractKeywords()">استخراج الكلمات المفتاحية</button>
      <button onclick="extractEntities()">استخراج الكيانات</button>
    </div>
    <div id="summary" class="result" style="display:none"></div>
    <div id="keywords" class="result" style="display:none"></div>
    <div id="entities" class="result" style="display:none"></div>
    <div id="loader" class="loader"></div>
  </div>
  <script>
    // دوال التصفية يجب أن تكون في الأعلى قبل أي استخدام
    function filterKeywords(words) {
      // استبعاد الكلمات القصيرة جدًا أو العامة أو الرقمية
      return words.filter(w => w.length > 3 && !/^\d+$/.test(w) && !w.match(/[a-zA-Z]/));
    }
    function filterEntities(arr) {
      return arr.filter(e => e.length > 4 && !/^\d+$/.test(e));
    }
    // TextRank summarization (ذكي)
    function sentenceSimilarity(s1, s2) {
      const words1 = s1.split(/\s+/);
      const words2 = s2.split(/\s+/);
      const set1 = new Set(words1);
      const set2 = new Set(words2);
      const intersection = new Set([...set1].filter(x => set2.has(x)));
      if (intersection.size === 0) return 0;
      return intersection.size / (Math.log(words1.length) + Math.log(words2.length));
    }
    function buildSimilarityMatrix(sentences) {
      const n = sentences.length;
      const matrix = Array.from({length: n}, () => Array(n).fill(0));
      for (let i = 0; i < n; i++) {
        for (let j = 0; j < n; j++) {
          if (i !== j) {
            matrix[i][j] = sentenceSimilarity(sentences[i], sentences[j]);
          }
        }
      }
      return matrix;
    }
    function textRankScores(matrix, d = 0.85, maxIter = 20, minDiff = 1e-5) {
      const n = matrix.length;
      let scores = Array(n).fill(1.0);
      for (let iter = 0; iter < maxIter; iter++) {
        let prev = scores.slice();
        for (let i = 0; i < n; i++) {
          let sum = 0;
          for (let j = 0; j < n; j++) {
            if (matrix[j][i] !== 0) {
              let norm = matrix[j].reduce((a, b) => a + b, 0);
              if (norm !== 0) sum += (matrix[j][i] / norm) * prev[j];
            }
          }
          scores[i] = (1 - d) + d * sum;
        }
        // check convergence
        let diff = scores.reduce((acc, s, i) => acc + Math.abs(s - prev[i]), 0);
        if (diff < minDiff) break;
      }
      return scores;
    }
    // تلخيص النص وإرجاع الجمل الملخصة (للاستخدام في استخراج الكلمات المفتاحية)
    function getSummarySentences(text, n) {
      const sentences = text.match(/[^.!؟\n]+[.!؟\n]+/g) || [text];
      if (sentences.length <= n) return sentences;
      const matrix = buildSimilarityMatrix(sentences);
      const scores = textRankScores(matrix);
      return sentences.map((s, i) => ({s, score: scores[i], idx: i}))
        .sort((a, b) => b.score - a.score || a.idx - b.idx)
        .slice(0, n)
        .sort((a, b) => a.idx - b.idx)
        .map(obj => obj.s);
    }
    // دالة Debounce
    function debounce(func, delay) {
      let timeout;
      return function(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), delay);
      };
    }
    // دالة إظهار/إخفاء اللودر
    function showLoader(show) {
      document.getElementById('loader').style.display = show ? 'block' : 'none';
    }
    // تعديل summarize ليظهر اللودر
    function summarize() {
      const text = document.getElementById('news').value;
      const n = parseInt(document.getElementById('summaryLen').value) || 3;
      if (!text.trim()) {
        alert('يرجى إدخال نص الخبر أولاً');
        return;
      }
      showLoader(true);
      setTimeout(() => {
        const summarySentences = getSummarySentences(text, n);
        const summary = summarySentences.join(' ');
        document.getElementById('summary').style.display = 'block';
        document.getElementById('summary').innerText = summary || 'لم يتمكن الذكاء الاصطناعي من تلخيص النص.';
        showLoader(false);
      }, 400);
    }
    // استخراج كلمات مفتاحية سياقية من الجمل الملخصة فقط
    function extractKeywords() {
      const text = document.getElementById('news').value;
      const num = parseInt(document.getElementById('keywordsNum').value) || 10;
      const n = parseInt(document.getElementById('summaryLen').value) || 3;
      if (!text.trim()) {
        alert('يرجى إدخال نص الخبر أولاً');
        return;
      }
      showLoader(true);
      setTimeout(() => {
        // قائمة كلمات شائعة عربية (يمكنك تطويرها)
        const stopwords = [
          'من','في','على','و','عن','إلى','أن','ما','لا','لم','لن','قد','هذا','هذه','هو','هي','كان','كانت','ذلك','هناك','كل','أو','أي','إذا','لكن','بين','بعد','قبل','مع','حتى','ثم','حيث','أكثر','أقل','أحد','أثناء','أمام','أصبح','أصبحوا','أصبحنا','أصبحتم','أصبحن','أصبح','أصبحت','أصبحا','أصبحوا','أصبحنا','أصبحتم','أصبحن','أصبح','أصبحت','أصبحا','أصبحوا','أصبحنا','أصبحتم','أصبحن'
        ];
        // استخدم فقط الجمل الملخصة
        const summarySentences = getSummarySentences(text, n);
        const summaryText = summarySentences.join(' ');
        // تقسيم النص إلى كلمات
        let words = summaryText.replace(/[.,!؟\n\r]/g, ' ').split(/\s+/).map(w => w.trim()).filter(w => w.length > 2 && !stopwords.includes(w));
        // تحسين تصفية الكلمات المفتاحية
        words = filterKeywords(words);
        // بناء شبكة ترابط الكلمات (نافذة 2)
        const windowSize = 2;
        const graph = {};
        for (let i = 0; i < words.length; i++) {
          if (!graph[words[i]]) graph[words[i]] = new Set();
          for (let j = Math.max(0, i - windowSize); j <= Math.min(words.length - 1, i + windowSize); j++) {
            if (i !== j) graph[words[i]].add(words[j]);
          }
        }
        // تحويل الشبكة إلى مصفوفة
        const uniqueWords = Object.keys(graph);
        const wn = uniqueWords.length;
        const matrix = Array.from({length: wn}, () => Array(wn).fill(0));
        for (let i = 0; i < wn; i++) {
          for (let j = 0; j < wn; j++) {
            if (graph[uniqueWords[i]].has(uniqueWords[j])) matrix[i][j] = 1;
          }
        }
        // حساب درجات TextRank
        const scores = textRankScores(matrix);
        // ترتيب الكلمات حسب الأهمية
        const ranked = uniqueWords.map((w, i) => ({w, score: scores[i]}))
          .sort((a, b) => b.score - a.score)
          .slice(0, num)
          .map(obj => obj.w);
        document.getElementById('keywords').style.display = 'block';
        document.getElementById('keywords').innerHTML =
          ranked.length > 0
            ? '<div class="keywords">' + ranked.map(k => `<span class="keyword">${k}</span>`).join(' ') + '</div>'
            : 'لم يتم العثور على كلمات مفتاحية.';
        showLoader(false);
      }, 400);
    }
    // استخراج الكيانات (أشخاص، أماكن، منظمات) - مبسط
    function extractEntities() {
      const text = document.getElementById('news').value;
      if (!text.trim()) {
        alert('يرجى إدخال نص الخبر أولاً');
        return;
      }
      showLoader(true);
      setTimeout(() => {
        const personRegex = /(?:دكتور|د\.|السيد|السيدة|الأستاذ|الأستاذة)?\s*([\u0621-\u064A]{3,}(?:\s+[\u0621-\u064A]{3,}){0,3})/g;
        const orgRegex = /(وزارة|شركة|مستشفى|مؤسسة|جامعة|مدرسة|هيئة|مجلس|نادي|بنك|جمعية)\s+[\u0621-\u064A]{3,}/g;
        const placeRegex = /(مدينة|محافظة|قرية|دولة|بلدة|منطقة|حي|مطار|ميناء|شارع|ساحة|قصر|مستشفى|جامعة|مدرسة)\s+[\u0621-\u064A]{3,}/g;
        let persons = [], orgs = [], places = [];
        let m;
        while ((m = personRegex.exec(text)) !== null) {
          if (m[1] && m[1].length > 2) persons.push(m[1].trim());
        }
        let orgMatch;
        while ((orgMatch = orgRegex.exec(text)) !== null) {
          orgs.push(orgMatch[0].trim());
        }
        let placeMatch;
        while ((placeMatch = placeRegex.exec(text)) !== null) {
          places.push(placeMatch[0].trim());
        }
        // إزالة التكرار وتصفية النتائج
        persons = filterEntities([...new Set(persons)]);
        orgs = filterEntities([...new Set(orgs)]);
        places = filterEntities([...new Set(places)]);
        let html = '';
        if (persons.length) html += '<b>أشخاص:</b> <div class="entities">' + persons.map(e => `<span class="entity">${e}</span>`).join(' ') + '</div>';
        if (orgs.length) html += '<b>منظمات:</b> <div class="entities">' + orgs.map(e => `<span class="entity">${e}</span>`).join(' ') + '</div>';
        if (places.length) html += '<b>أماكن:</b> <div class="entities">' + places.map(e => `<span class="entity">${e}</span>`).join(' ') + '</div>';
        if (!html) html = 'لم يتم العثور على كيانات واضحة.';
        document.getElementById('entities').style.display = 'block';
        document.getElementById('entities').innerHTML = html;
        showLoader(false);
      }, 400);
    }
    // تفعيل Debounce عند الكتابة (يمكنك تفعيل التلخيص التلقائي بإزالة التعليق)
    document.getElementById('news').addEventListener('input',
      debounce(function() {
        // summarize();
        // extractKeywords();
        // extractEntities();
      }, 1200)
    );
  </script>
</body>
</html>
